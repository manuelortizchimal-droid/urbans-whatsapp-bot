name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa_password
          POSTGRES_DB: urbans_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa -d urbans_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://qa:qa_password@127.0.0.1:5432/urbans_qa?schema=public
      WHATSAPP_MODE: mock
      WHATSAPP_VERIFY_TOKEN: ${{ format('verify-{0}-{0}-{0}-{0}', github.run_id) }}
      INTERNAL_API_KEY: ${{ format('internal-{0}-{0}-{0}-{0}', github.run_id) }}
      STORE_MESSAGE_CONTENT: "false"
      LOG_LEVEL: warn
      PORT: "3100"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Refresh deterministic lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Refresh npm lockfile after security fixes"
            git push
          fi

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Apply migrations
        run: npm run prisma:migrate

      - name: End-to-end mock QA
        run: npm run qa

      - name: Dependency audit
        run: npm audit --audit-level=moderate
