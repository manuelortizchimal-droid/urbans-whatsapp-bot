name: Owner Prospecting QA
on:
  push:
    branches: [feature/owner-prospecting-mvp]
  pull_request:
    paths:
      - 'owner-prospecting/**'
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - '.github/workflows/owner-prospecting-qa.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_USER: testuser
          POSTGRES_DB: urbans_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/urbans_test
      WHATSAPP_MODE: mock
      WHATSAPP_VERIFY_TOKEN: test-verify-token-minimum-32-characters
      INTERNAL_API_KEY: test-internal-api-key-minimum-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npx tsx --test owner-prospecting/prospect.test.ts
      - run: node scripts/owner-prospects-qa.cjs
