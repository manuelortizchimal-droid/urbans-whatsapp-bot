name: Owner Prospecting QA
on:
  push:
    branches: [feature/owner-prospecting-mvp]
  pull_request:
    paths:
      - 'owner-prospecting/**'
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - '.github/workflows/owner-prospecting-qa.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_USER: testuser
          POSTGRES_DB: urbans_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/urbans_test
      WHATSAPP_MODE: mock
      WHATSAPP_VERIFY_TOKEN: test-verify-token-minimum-32-characters
      INTERNAL_API_KEY: test-internal-api-key-minimum-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Remediate dependencies and update lockfile
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          npm install zod@4.6.7 --save-exact
          npm audit fix
          npm audit --audit-level=moderate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --quiet || (git commit -m 'security: update vulnerable dependencies' && git push)
      - run: npm audit --audit-level=moderate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npx tsx --test owner-prospecting/prospect.test.ts
      - run: node scripts/owner-prospects-qa.cjs
