name: Dependency Remediation (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/feature/owner-prospecting-mvp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Update Zod to patched major and fix safe dependency versions
        run: |
          npm install zod@^4.6.7 --save-exact
          npm audit fix
      - run: npm audit --audit-level=moderate
      - name: Commit lockfile and package changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || (git commit -m "security: remediate npm advisories" && git push)
